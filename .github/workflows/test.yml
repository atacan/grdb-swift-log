name: Test

permissions:
    contents: read

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        # Apple platforms only, by design: Linux and Windows are unsupported, so there is no container matrix.
        name: Test (macOS)
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v5  # Node 24 runtime; v4 triggers GitHub's Node 20 deprecation warnings
            - name: Run tests
              run: swift test
